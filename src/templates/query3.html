{% extends "base.html" %}
{% block content %}

<h2>Products not ordered by Impression</h2>

<table>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Price</th>
  </tr>

  {% for p in products %}
  <tr>
    <td>{{ p.id }}</td>
    <td>{{ p.name }}</td>
    <td>{{ p.price }}</td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
