{% extends "base.html" %}

{% block content %}
  <h1>Product Types</h1>

  <div
      style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-right: 10px;">
    <form method="get" style="flex:1;">
      <input type="text" name="name" placeholder="Filter by name" value="{{ filter_name }}">
      <button type="submit">🔍</button>
    </form>

    <a href="/product-types/create" style="
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 4px;
      margin-left: 10px;
  ">Create</a>
  </div>

  {% if product_types %}
    <table style="width:100%; border-collapse: collapse;">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
      </tr>

      {% for item in product_types %}
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.name }}</td>
          <td style="background-color: #007bff; text-align:center;">
            <a href="/product-types/update/{{ item.id }}" style="
              color:white;
              text-decoration:none;
              display:inline-block;
              width:100%;
              height:100%;
              padding:4px 0;
          ">Update</a>
          </td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <div style="text-align:center; color:black; padding:20px; border:1px solid #ddd; margin-top:10px;">
      No results found
    </div>
  {% endif %}

{% endblock %}
