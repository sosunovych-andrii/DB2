{% extends "base.html" %}

{% block content %}
  <h1>Create Price List</h1>

  <form method="post" style="max-width:400px;">

    <label>Unit price:</label><br>
    <input type="number" step="0.01" name="unit_price"
           value="{{ form_data.unit_price | default('') }}"><br><br>

    <label>Manufacturer:</label><br>
    <select name="manufacturer_id">
      <option value="">-- Select --</option>
      {% for m in manufacturers %}
        <option value="{{ m.id }}"
                {% if form_data.manufacturer_id == m.id %}selected{% endif %}>
          {{ m.name }}
        </option>
      {% endfor %}
    </select><br><br>

    <label>Product type:</label><br>
    <select name="product_type_id">
      <option value="">-- Select --</option>
      {% for p in product_types %}
        <option value="{{ p.id }}"
                {% if form_data.product_type_id == p.id %}selected{% endif %}>
          {{ p.name }}
        </option>
      {% endfor %}
    </select><br><br>

    <button type="submit"
            style="background-color:#28a745; color:white; padding:10px; border:none;">
      Create
    </button>
  </form>
{%endblock %}
