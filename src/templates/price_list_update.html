{% extends "base.html" %}

{% block content %}
  <h1>Update Price List</h1>

  <form method="post" style="max-width:400px;">

    <label>Unit price:</label><br>
    <input type="number" step="0.01" name="unit_price"
           value="{{ price.unit_price }}"><br><br>

    <label>Manufacturer:</label><br>
    <select name="manufacturer_id">
      <option value=""
              {% if price.manufacturer_id is none %}selected{% endif %}>
        -- None --
      </option>

      {% for m in manufacturers %}
        <option value="{{ m.id }}"
                {% if price.manufacturer_id == m.id %}selected{% endif %}>
          {{ m.name }}
        </option>
      {% endfor %}
    </select><br><br>

    <label>Product type:</label><br>
    <select name="product_type_id">
      <option value=""
              {% if price.product_type_id is none %}selected{% endif %}>
        -- None --
      </option>

      {% for p in product_types %}
        <option value="{{ p.id }}"
                {% if price.product_type_id == p.id %}selected{% endif %}>
          {{ p.name }}
        </option>
      {% endfor %}
    </select><br><br>

    <button type="submit"
            style="background-color:#007bff; color:white; padding:10px; border:none;">
      Update
    </button>
  </form>

{% endblock %}
