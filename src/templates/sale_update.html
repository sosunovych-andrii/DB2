{% extends "base.html" %}

{% block content %}
  <h1>Update Sale</h1>

  <form method="post" style="max-width:400px;">

    <label>Amount:</label><br>
    <input type="number" name="amount"
           value="{{ sale.amount }}"><br><br>

    <label>Sale date:</label><br>
    <input type="datetime-local" name="sale_date"
           value="{{ sale.sale_date }}"><br><br>

    <label>Payment date:</label><br>
    <input type="datetime-local" name="payment_date"
           value="{{ sale.payment_date }}"><br><br>

    <label>Price list:</label><br>
    <select name="price_list_id">
      <option value=""
              {% if sale.price_list_id is none %}selected{% endif %}>
        -- None --
      </option>

      {% for p in price_lists %}
        <option value="{{ p.id }}"
                {% if sale.price_list_id == p.id %}selected{% endif %}>
          {{ p.id }} - {{ p.unit_price }}
        </option>
      {% endfor %}
    </select><br><br>

    <button type="submit"
            style="background-color:#007bff; color:white; padding:10px; border:none;">
      Update
    </button>

  </form>

{% endblock %}
