{% extends "base.html" %}

{% block content %}
<h1>Create Product Type</h1>

<form method="post" style="max-width:400px;">
    <label>Name:</label><br>
    <input type="text" name="name" value="{{ form_data.name | default('') }}"><br>

    <button type="submit" style="
        background-color: #28a745;
        color:white;
        padding:10px 15px;
        border:none;
        border-radius:4px;
        cursor:pointer;
    ">Create</button>
</form>

{% endblock %}
